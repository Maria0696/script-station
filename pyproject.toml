[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"


[project]
name = "script-station"
version = "0.1.0"
description = "Automation and monitoring toolkit"
readme = "README.md"
requires-python = ">=3.12"

# Fuente única de dependencias. requirements*.txt se generan con:
#   uv pip compile pyproject.toml --python-version 3.12 \
#     --python-platform x86_64-unknown-linux-gnu -o requirements.txt
#   uv pip compile pyproject.toml --extra dev -c requirements.txt \
#     --python-version 3.12 --python-platform x86_64-unknown-linux-gnu \
#     -o requirements-dev.txt
dependencies = [
    "fastapi>=0.141,<1",
    "python-dotenv>=1.2,<2",
    "PyYAML>=6.0,<7",
    "questionary>=2.1,<3",
    "requests>=2.34,<3",
    "tzdata>=2026.4",
    # core/http.py importa Retry directamente
    "urllib3>=2.7,<3",
]


[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.7,<0.17",
]


[project.scripts]
script-station = "station_cli:main"


[tool.setuptools]
py-modules = [
    "station_cli",
]


[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "api*",
    "core*",
    "scripts*",
]
namespaces = true


[tool.ruff.format]
# Agrupa en una línea todo lo que cabe, aunque lleve coma final
skip-magic-trailing-comma = true


[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # orden de imports
    "B",    # bugbear: errores probables
    "UP",   # sintaxis moderna de Python
    "SIM",  # simplificaciones
    "C4",   # comprehensions
    "S",    # seguridad (bandit)
    "RUF",  # reglas propias de Ruff
]


# Emoji ℹ️ de los mensajes de Huginn
allowed-confusables = ["ℹ"]


[tool.ruff.lint.per-file-ignores]
# assert y credenciales falsas son normales en los tests
"tests/**" = ["S101", "S105", "S106"]


[tool.ruff.lint.isort]
# Coherente con skip-magic-trailing-comma
split-on-trailing-comma = false
