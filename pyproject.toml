[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"


[project]
name = "script-station"
version = "0.1.0"
description = "Automation and monitoring toolkit"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "python-dotenv",
    "PyYAML",
    "questionary",
    "requests",
    "tzdata",
]


[project.scripts]
script-station = "station_cli:main"


[tool.setuptools]
py-modules = [
    "station_cli",
]


[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "api*",
    "core*",
    "scripts*",
]
namespaces = true


[tool.ruff.format]
# Agrupa en una línea todo lo que cabe, aunque lleve coma final
skip-magic-trailing-comma = true


[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # orden de imports
    "B",    # bugbear: errores probables
    "UP",   # sintaxis moderna de Python
    "SIM",  # simplificaciones
    "C4",   # comprehensions
    "S",    # seguridad (bandit)
    "RUF",  # reglas propias de Ruff
]


# Emoji ℹ️ de los mensajes de Huginn
allowed-confusables = ["ℹ"]


[tool.ruff.lint.per-file-ignores]
# assert y credenciales falsas son normales en los tests
"tests/**" = ["S101", "S105", "S106"]


[tool.ruff.lint.isort]
# Coherente con skip-magic-trailing-comma
split-on-trailing-comma = false
