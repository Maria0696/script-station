name: Daily Video Game Releases

on:
  schedule:
    # 08:00 en invierno, 09:00 en verano
    - cron: '0 7 * * *'

  workflow_dispatch:
    inputs:
      debug:
        description: "Enable detailed popularity logs"
        required: false
        type: boolean
        default: false

jobs:
  send-release-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send daily release report
        run: python scripts/video_game_releases.py
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG: ${{ inputs.debug || 'false' }}
      
      - name: Test failure alert
        run: exit 1

      - name: Notify Heimdall on failure
        if: ${{ always() && failure() }}
        run: |
          MESSAGE="⚠️ WORKFLOW FAILED

          🔧 ${{ github.workflow }}
          📦 ${{ github.repository }}

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_HEIMDALL_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_HEIMDALL_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
        env:
          TELEGRAM_HEIMDALL_BOT_TOKEN: ${{ secrets.TELEGRAM_HEIMDALL_BOT_TOKEN }}
          TELEGRAM_HEIMDALL_CHAT_ID: ${{ secrets.TELEGRAM_HEIMDALL_CHAT_ID }}
