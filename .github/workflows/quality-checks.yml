name: Quality Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run RSpec
        run: bundle exec rspec

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
      
      - name: Test failure alert
        run: exit 1
      
      - name: Notify Heimdall on failure
        if: ${{ always() && failure() }}
        run: |
          MESSAGE="⚠️ WORKFLOW FAILED

          🔧 ${{ github.workflow }}
          📦 ${{ github.repository }}

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_HEIMDALL_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_HEIMDALL_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
        env:
          TELEGRAM_HEIMDALL_BOT_TOKEN: ${{ secrets.TELEGRAM_HEIMDALL_BOT_TOKEN }}
          TELEGRAM_HEIMDALL_CHAT_ID: ${{ secrets.TELEGRAM_HEIMDALL_CHAT_ID }}
