name: Quality Checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: quality-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # RUBY
      # ============================================================

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install Ruby dependencies
        run: bundle install

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run RSpec
        run: bundle exec rspec -I tests/ruby tests/ruby

      - name: Upload Ruby coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage-report
          path: coverage/
          if-no-files-found: ignore

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Pytest
        run: |
          python -m pytest \
            --cov=core.igdb \
            --cov-report=term-missing \
            --cov-report=html:coverage-python \
            --cov-fail-under=90

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-report
          path: coverage-python/
          if-no-files-found: ignore

      # ============================================================
      # HEIMDALL
      # ============================================================

      - name: Notify Heimdall on failure
        if: ${{ always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          MESSAGE="⚠️ WORKFLOW FAILED

          🔧 ${{ github.workflow }}
          📦 ${{ github.repository }}

          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_HEIMDALL_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_HEIMDALL_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
        env:
          TELEGRAM_HEIMDALL_BOT_TOKEN: ${{ secrets.TELEGRAM_HEIMDALL_BOT_TOKEN }}
          TELEGRAM_HEIMDALL_CHAT_ID: ${{ secrets.TELEGRAM_HEIMDALL_CHAT_ID }}
