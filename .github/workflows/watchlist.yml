name: Watchlist Release Monitor

on:
  # Lo lanza a diario el cron de Vercel (/api/cron) a las 07:00 UTC.
  # El "schedule" de GitHub llegaba con horas de retraso.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-watchlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # El monitor guarda la watchlist con la API de GitHub y
      # solo después envía los avisos. master exige PR, así que
      # usa un token de admin que puede saltarse la regla.
      - name: Check watchlist release dates
        run: python -m scripts.watchlist_monitor
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.WATCHLIST_PUSH_TOKEN }}

      - name: Notify Heimdall on failure
        if: ${{ always() && failure() }}
        run: python -m scripts.notify workflow-failed
        env:
          TELEGRAM_HEIMDALL_BOT_TOKEN: ${{ secrets.TELEGRAM_HEIMDALL_BOT_TOKEN }}
          TELEGRAM_HEIMDALL_CHAT_ID: ${{ secrets.TELEGRAM_HEIMDALL_CHAT_ID }}
