name: Post-deploy Smoke Test

on:
  # Vercel publica el estado de cada despliegue en GitHub
  deployment_status:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    # Solo despliegues de producción que han terminado bien
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check production endpoints
        run: python -m scripts.smoke_test

      - name: Notify Heimdall on failure
        if: ${{ always() && failure() }}
        run: python -m scripts.notify workflow-failed
        env:
          TELEGRAM_HEIMDALL_BOT_TOKEN: ${{ secrets.TELEGRAM_HEIMDALL_BOT_TOKEN }}
          TELEGRAM_HEIMDALL_CHAT_ID: ${{ secrets.TELEGRAM_HEIMDALL_CHAT_ID }}
